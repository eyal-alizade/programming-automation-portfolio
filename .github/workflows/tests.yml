name: Portfolio tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node for frontend workflow tests
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install API development dependencies
        run: python -m pip install -r stockpilot-api/requirements-dev.txt
      - name: Run project test suites
        run: python tools/check_portfolio.py
